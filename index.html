<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Nebula Fox Studio</title>
<meta name="description" content="Nebula Fox Studio: a daily spark, my designs, and my deals. Works offline.">
<meta name="theme-color" content="#070a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebula Fox">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/spark.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/intro.css">
</head>
<body>
<div id="nfs-intro" class="nfs-intro"><canvas aria-hidden="true"></canvas><button class="nfs-go" type="button">Begin ✦</button></div>
<div id="nfs-glow" class="nfs-glow" aria-hidden="true"></div>
<script src="js/shell.js"></script>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="top">
  <h1 class="title"><span class="spark-mark" aria-hidden="true">✦</span> <span id="title">Nebula Fox Studio</span></h1>
  <button id="sound" class="round" type="button" aria-pressed="false" aria-label="Sound off" title="Sound">&#9835;</button>
</header>

<section class="today" aria-labelledby="today-label">
  <p id="today-label" class="eyebrow">today's spark</p>
  <p id="line" class="line" role="status"></p>
</section>

<p id="hint" class="hint" aria-live="polite">tap the wand</p>

<button id="wand" class="wand" type="button" aria-label="Magic wand. Tap to cast a spark.">
  <svg viewBox="0 0 120 520" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="wood" x1="0" x2="1">
        <stop offset="0" stop-color="#2a1a2e"/>
        <stop offset=".45" stop-color="#5a3a52"/>
        <stop offset="1" stop-color="#1c1224"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" x2="1">
        <stop offset="0" stop-color="#b9873a"/>
        <stop offset=".5" stop-color="#ffe2a0"/>
        <stop offset="1" stop-color="#a7752c"/>
      </linearGradient>
      <radialGradient id="tipglow">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".25" stop-color="#fff1c9"/>
        <stop offset=".6" stop-color="#ffd27a" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle class="tip-halo" cx="60" cy="60" r="56" fill="url(#tipglow)"/>
    <!-- shaft: slim at the tip, wider at the handle -->
    <path d="M57 66 L63 66 L69 330 L51 330 Z" fill="url(#wood)"/>
    <!-- handle -->
    <path d="M50 330 L70 330 L73 492 Q60 504 47 492 Z" fill="url(#wood)"/>
    <rect x="48" y="326" width="24" height="9" rx="3" fill="url(#gold)"/>
    <rect x="48" y="372" width="25" height="5" rx="2" fill="url(#gold)" opacity=".85"/>
    <rect x="47" y="452" width="26" height="5" rx="2" fill="url(#gold)" opacity=".85"/>
    <circle cx="60" cy="497" r="7" fill="url(#gold)"/>
    <!-- four-point star at the tip -->
    <path class="tip-star" d="M60 34 L65 55 L86 60 L65 65 L60 86 L55 65 L34 60 L55 55 Z" fill="#fff6dc"/>
  </svg>
  <svg class="charge" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <circle cx="50" cy="50" r="44" pathLength="100"/>
  </svg>
</button>

<footer class="level" aria-label="Your level">
  <div class="level-row">
    <span class="level-name"><span class="lvl-num">Level <b id="lvl">1</b></span> · <b id="lvlname">Spark</b></span>
    <span id="streak" class="streak"></span>
  </div>
  <div class="bar" role="progressbar" aria-labelledby="next" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="fill"></i></div>
  <div class="level-row small">
    <span id="next"></span>
    <span id="casts"></span>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="note" class="note" role="dialog" aria-modal="true" aria-labelledby="note-title" hidden>
  <div class="card">
    <p class="seal" aria-hidden="true">✉</p>
    <h2 id="note-title">A note from Dad</h2>
    <div id="note-body" class="note-body"></div>
    <button id="note-close" class="pill" type="button">Back to my wand</button>
  </div>
</div>

<noscript><p class="nojs">Your wand needs JavaScript turned on to sparkle.</p></noscript>
<script src="js/config.js"></script>
<script src="js/spark.js"></script>
<script src="js/intro.js"></script>
<nav class="nfs-tabs" aria-label="Nebula Fox Studio">
  <a href="./" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.5 4.6 2.4 7.3 8.5 9.5-6.1 2.2-8 4.9-8.5 9.5-.5-4.6-2.4-7.3-8.5-9.5 6.1-2.2 8-4.9 8.5-9.5z"/></svg>Spark</a>
  <a href="studio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1.1-1.6-1.1-2.7 0-1 .8-1.6 1.9-1.6H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.2" r="1.2"/></svg>Studio</a>
  <a href="deals.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.4 1.4 0 0 1 0 2l-6.7 6.7a1.4 1.4 0 0 1-2 0z"/><circle cx="8" cy="8" r="1.6"/></svg>Deals</a>
  <a href="shop.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</a>
</nav>
</body>
</html>
